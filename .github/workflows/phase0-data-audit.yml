name: Phase 0 — Download and Audit Data

on:
  workflow_dispatch:
    inputs:
      download_all:
        description: "Download every Kaggle dataset from the authoritative manifest"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase0-data-audit.yml"
      - "configs/data/datasets.json"
      - "scripts/download_kaggle_datasets.py"
      - "scripts/audit_phase0.py"
      - "data/master_ml_final_may31.csv"
      - "data/master_ml_final_june15.csv"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  phase0:
    name: Download, audit and publish evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Phase 0 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Download all declared Kaggle datasets
        id: download
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python scripts/download_kaggle_datasets.py \
            --manifest configs/data/datasets.json \
            --output data/external \
            --status data/manifests/datasets_download_status.json \
            --continue-on-error

      - name: Audit final 31-May and 15-June datasets
        id: audit
        continue-on-error: true
        run: |
          python scripts/audit_phase0.py

      - name: Build Phase 0 execution summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path("reports/phase0/phase0_data_audit.json")
          download_path = Path("data/manifests/datasets_download_status.json")
          lines = ["# Phase 0 execution summary", ""]
          if download_path.exists():
              data = json.loads(download_path.read_text(encoding="utf-8"))
              summary = data.get("summary", {})
              lines += [
                  f"- Kaggle datasets requested: **{summary.get('requested', 0)}**",
                  f"- Downloaded: **{summary.get('downloaded', 0)}**",
                  f"- Failed: **{summary.get('failed', 0)}**",
              ]
          else:
              lines.append("- Kaggle download manifest was not produced.")
          if audit_path.exists():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))
              gate = audit.get("gate", {})
              lines += [
                  f"- G0 status: **{gate.get('status', 'UNKNOWN')}**",
                  f"- Blocking findings: **{len(gate.get('blockers', []))}**",
                  f"- Warnings: **{len(gate.get('warnings', []))}**",
              ]
          else:
              lines.append("- Automated audit report was not produced.")
          Path("reports/phase0").mkdir(parents=True, exist_ok=True)
          Path("reports/phase0/execution_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit audit evidence to main
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase0 data/manifests
          if git diff --cached --quiet; then
            echo "No generated evidence to commit."
          else
            git commit -m "data: publish automated Phase 0 audit evidence"
            git push
          fi

      - name: Upload Phase 0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-audit-evidence
          path: |
            reports/phase0
            data/manifests
            configs/data/datasets.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload downloaded Kaggle data
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase0-kaggle-data
          path: data/external
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
