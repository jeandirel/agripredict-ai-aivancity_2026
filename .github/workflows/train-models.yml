name: Train leakage-safe baseline models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/train_models.py"
      - "data/master_ml_final_may31.csv"
      - "data/master_ml_final_june15.csv"
      - ".github/workflows/train-models.yml"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Audit datasets
        continue-on-error: true
        run: python scripts/audit_phase0.py
      - name: Train and compare models
        run: python scripts/train_models.py --output artifacts/models --report-dir reports/modeling
      - name: Run tests
        run: pytest -q
      - name: Commit benchmark reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/modeling reports/phase0
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "ml: publish leakage-safe baseline benchmark"
            git push
          fi
      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-models
          path: artifacts/models
          retention-days: 30
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-benchmark
          path: reports
          retention-days: 30
