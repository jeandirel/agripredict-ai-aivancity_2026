name: Finalize all AgriPredict phases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "scripts/finalize_project.py"
      - "tests/**"
      - "data/master_ml_final_may31.csv"
      - "data/master_ml_final_june15.csv"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/finalize-project.yml"

concurrency:
  group: agripredict-finalize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    name: Scientific evaluation, product validation and delivery
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit final datasets
        continue-on-error: true
        run: python scripts/audit_phase0.py

      - name: Run strict final evaluation and generate all deliverables
        id: generation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/final
          python scripts/finalize_project.py \
            --output artifacts/models \
            --report-dir reports/final \
            --random-state 42 2>&1 | tee /tmp/agripredict-finalize.log

      - name: Publish generation status to the repository
        if: always()
        shell: bash
        run: |
          mkdir -p reports/final
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = "${{ steps.generation.outcome }}"
          log_path = Path("/tmp/agripredict-finalize.log")
          log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else "No generation log was produced."
          status = "SUCCEEDED" if outcome == "success" else "FAILED"
          content = "\n".join([
              "# Finalization workflow status",
              "",
              f"- Status: **{status}**",
              f"- Step outcome: `{outcome}`",
              f"- Generated at: `{datetime.now(timezone.utc).isoformat()}`",
              "- Commit: `${{ github.sha }}`",
              "- Run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`",
              "",
              "## Last generation log lines",
              "",
              "```text",
              *log.splitlines()[-120:],
              "```",
              "",
          ])
          Path("reports/final/WORKFLOW_STATUS.md").write_text(content, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/final/WORKFLOW_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish AgriPredict finalization status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stop after failed generation
        if: steps.generation.outcome != 'success'
        run: |
          echo "The final evaluation failed. See reports/final/WORKFLOW_STATUS.md."
          exit 1

      - name: Enforce stable parcel-group terminology in generated evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("reports/final"), Path("artifacts/models")]
          replacements = {
              "GroupKFold by parcelle_uid": "GroupKFold by ID_PARCEL",
              "validation groupée par `parcelle_uid`": "validation groupée par `ID_PARCEL`",
              "GroupKFold par `parcelle_uid`": "GroupKFold par `ID_PARCEL`",
          }
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.suffix.lower() not in {".md", ".json", ".csv"} or not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8")
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Run unit and API tests
        run: pytest --cov=src/agripredict --cov=app/api --cov-report=term-missing --cov-report=xml

      - name: Run static quality checks
        run: ruff check src app scripts tests

      - name: Start API and perform smoke tests
        run: |
          uvicorn app.api.main:app --host 127.0.0.1 --port 8000 > /tmp/agripredict-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json || { cat /tmp/agripredict-api.log; exit 1; }
          cat /tmp/health.json
          curl --fail --silent http://127.0.0.1:8000/readiness > /tmp/readiness.json
          cat /tmp/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(Path("/tmp/readiness.json").read_text())
          assert readiness["status"] == "ready", readiness
          PY

      - name: Commit validated final scientific reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/final reports/phase0
          if git diff --cached --quiet; then
            echo "No generated report changes."
          else
            git commit -m "release: publish final AgriPredict v1.0.0 evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build production container
        run: |
          docker build -t agripredict-ai:1.0.0 .
          docker build -t agripredict-observatory:1.0.0 frontend

      - name: Create delivery bundle
        run: |
          mkdir -p dist/agripredict-ai-v1.0.0
          cp -r reports/final dist/agripredict-ai-v1.0.0/reports
          cp -r artifacts/models dist/agripredict-ai-v1.0.0/models
          cp README.md pyproject.toml Dockerfile docker-compose.yml dist/agripredict-ai-v1.0.0/
          cp docs/data_sources.md docs/project_charter.md docs/problem_statement.md docs/research_questions.md dist/agripredict-ai-v1.0.0/
          cp docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/ETHICS_AND_GOVERNANCE.md dist/agripredict-ai-v1.0.0/
          tar -czf dist/agripredict-ai-v1.0.0.tar.gz -C dist agripredict-ai-v1.0.0

      - name: Upload trained models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-v1-models
          path: artifacts/models
          retention-days: 90
          if-no-files-found: warn

      - name: Upload final scientific reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-v1-reports
          path: reports/final
          retention-days: 90
          if-no-files-found: warn

      - name: Upload complete delivery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-v1-delivery
          path: dist/agripredict-ai-v1.0.0.tar.gz
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agripredict-coverage
          path: coverage.xml
          retention-days: 30
          if-no-files-found: warn
